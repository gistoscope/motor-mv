name: CI (sandbox)

on:
  pull_request:
    branches: [sandbox]
  push:
    branches: [sandbox]

jobs:
  verify-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20.19.5
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          cache: 'pnpm'

      - name: Enable Corepack
        run: corepack enable

      # В GitHub-hosted runners Corepack уже знает pnpm 9.x; эта команда наглядности ради
      - name: Show pnpm version
        run: pnpm -v

      # Важно для кейса с optional native deps на Linux (rollup):
      # не замораживаем lock, чтобы не падать из-за optional-deps багов в Linux окружении CI
      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      # При необходимости можно прогреть сборку пакетов (раскомментировать следующую строку)
      # - name: Build all packages
      #   run: pnpm -r build

      - name: Run tests recursively
        run: pnpm -r test