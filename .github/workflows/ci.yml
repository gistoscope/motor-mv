name: CI (sandbox)

on:
  pull_request:
    branches: [sandbox]
  push:
    branches: [sandbox]

permissions:
  contents: read

jobs:
  verify-test:
    name: verify-test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (20.19.5)
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          # ВАЖНО: без cache

      # Страховка 1  Corepack: положить pnpm в PATH через нативный инструмент Node
      - name: Corepack prepare pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm --version
        shell: bash

      # Страховка 2  npm -g: даже если corepack по какой-то причине не сработает
      - name: npm global install pnpm
        run: |
          npm i -g pnpm@9.12.0
          pnpm --version
        shell: bash

      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
        shell: bash

      - name: node scripts/generate-aliases.mjs + --check
        run: |
          node scripts/generate-aliases.mjs
          node scripts/generate-aliases.mjs --check
        shell: bash

      - name: pnpm verify
        run: pnpm verify
        shell: bash

      - name: pnpm -r test
        run: pnpm -r test
        shell: bash
