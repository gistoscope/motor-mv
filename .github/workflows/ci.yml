name: CI (sandbox)

on:
  pull_request:
    branches: [sandbox]
  push:
    branches: [sandbox]

permissions:
  contents: read

jobs:
  verify-test:
    name: verify-test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (20.19.5)
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          # cache отключаем, чтобы исключить побочные эффекты
          cache: ''

      # pnpm через Corepack  этого ДОВОЛЬНО, конфликтов с npm -g не будет
      - name: Corepack prepare pnpm@9.12.0
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm --version

      - name: pnpm install --frozen-lockfile
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: node scripts/generate-aliases.mjs + --check
        shell: bash
        run: |
          node scripts/generate-aliases.mjs
          node scripts/generate-aliases.mjs --check

      - name: pnpm verify
        shell: bash
        run: pnpm verify

      - name: pnpm -r test
        shell: bash
        run: pnpm -r test
