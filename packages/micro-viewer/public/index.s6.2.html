<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Micro Viewer S6.2 — Range + Context Menu</title>
  <link rel="stylesheet" href="mv.s6.css">
  <script defer type="module" src="../src/app.s6.2.js"></script>
</head>
<body>
  <div id="mv-toolbar">
    <button id="mv-undo">Undo</button>
    <button id="mv-redo">Redo</button>
    <button id="mv-reset">Reset</button>
    <button id="mv-help">Help</button>
  </div>

  <main class="mv-grid">
    <section class="mv-panel">
      <h2>Display Window</h2>
      <div id="mv-container" class="mv-display"></div>
    </section>

    <section class="mv-panel">
      <h2>Input Window</h2>
      <div class="mv-input-row">
        <label for="mv-format">Format:</label>
        <select id="mv-format">
          <option value="ascii">ASCII</option>
          <option value="latex">LaTeX</option>
        </select>
        <span class="mv-note">debounce 200 ms</span>
      </div>
      <textarea id="mv-input" rows="6" spellcheck="false"></textarea>
    </section>
  </main>

  <div id="mv-menu" class="mv-menu" hidden>
    <button data-action="wrap">Wrap in parentheses</button>
    <button data-action="unwrap">Remove parentheses</button>
    <button data-action="explain">Explain</button>
  </div>
</body>
</html>
