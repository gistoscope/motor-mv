<!doctype html>
<html lang="en" data-theme="light" data-density="comfortable" style="--mv-font-scale:1">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Micro Viewer — S6.8 (plugins & options)</title>
  <style>
    html { font-size: calc(16px * var(--mv-font-scale,1)); }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 18px; }
    .toolbar { display:flex; gap:12px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items:start; }
    /* Density via attribute */
    #display { border:1px solid #ddd; min-height: 180px; padding: 12px; border-radius: 10px; user-select:none; -webkit-user-select:none; }
    html[data-density="compact"] #display { padding: 8px; }
    html[data-density="comfortable"] #display { padding: 12px; }
    #input { width:100%; min-height:120px; }
    [data-theme="dark"] body { background:#0b0b0b; color:#e5e7eb; }
    .paren { padding: 0 2px; border-radius: 6px; }
    .paren.hover { outline: 2px solid #8b5cf6; }
    .paren.ok { background: rgba(63,185,80,.15); box-shadow: inset 0 0 0 2px #3fb950; }
    .paren.blocked { background: rgba(239,68,68,.12); box-shadow: inset 0 0 0 2px #ef4444; }
  </style>
</head>
<body>
  <div class="toolbar">
    <label>Theme:
      <select id="opt-theme">
        <option value="light" selected>light</option>
        <option value="dark">dark</option>
      </select>
    </label>
    <label>Density:
      <select id="opt-density">
        <option value="comfortable" selected>comfortable</option>
        <option value="compact">compact</option>
      </select>
    </label>
    <label>Scale:
      <input id="opt-scale" type="range" min="0.8" max="1.4" step="0.01" value="1.00">
      <span id="opt-scale-val">1.00</span>
    </label>
  </div>

  <div class="grid">
    <section>
      <h3>Display Window</h3>
      <div id="display" role="region" aria-label="Expression display"></div>
    </section>
    <section>
      <h3>Input Window</h3>
      <textarea id="input">(1+(2*3))/((4+5)*(6-2/3))</textarea>
    </section>
  </div>

  <script type="module" src="../src/app.s6.8.js"></script>
</body>
</html>
